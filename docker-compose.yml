version: '3.8'

services:
  doxa-motorisation-app:
    build: .
    container_name: doxa-motorisation-flutter-app
    ports:
      - "80:80"
      # Pour HTTPS, décommentez et configurez les certificats SSL
      # - "443:443"
    restart: unless-stopped
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.doxa-motorisation.rule=Host(`votre-domaine.com`)"
      - "traefik.http.routers.doxa-motorisation.entrypoints=web"

networks:
  web:
    external: false
